name: Publish presentation

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render Marp deck
        run: |
          mkdir -p _site
          docker run --rm --init -e MARP_USER="$(id -u):$(id -g)" \
            -v "$PWD:/home/marp/app" marpteam/marp-cli \
            presentation/slides.md --theme-set presentation/ofm.css \
            --allow-local-files --html -o _site/index.html
          docker run --rm --init -e MARP_USER="$(id -u):$(id -g)" \
            -v "$PWD:/home/marp/app" marpteam/marp-cli \
            presentation/slides.md --theme-set presentation/ofm.css \
            --allow-local-files --pdf -o _site/slides.pdf
          cp presentation/*.png _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
